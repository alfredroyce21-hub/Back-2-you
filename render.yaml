services:
  - type: web
    name: back2u
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: back2u-db
          property: connectionString

databases:
  - name: back2u-db
    databaseName: back2u
    user: back2u_user
